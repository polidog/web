parameters:
  # DATABASE_PATH が未設定ならプロジェクト内の var/cms.db。fly.io では
  # secrets/env で /data/cms.db（volume）を指す。%env()% を経由するのは
  # container:compile がビルド時の値を焼き込まないようにするため。
  app.default_database_path: '%app.project_root%/var/cms.db'
  app.database_path: '%env(default:app.default_database_path:DATABASE_PATH)%'

  # 管理画面からアップロードされた画像と、Hugo から移設した既存画像の置き場。
  # 本番は volume 上。Caddy が /images/* をここから直接配信する。
  app.default_uploads_dir: '%app.project_root%/var/uploads'
  app.uploads_dir: '%env(default:app.default_uploads_dir:UPLOADS_DIR)%'

  # ETag の保管先。既定は var/cache/etags だが、そこはイメージの中なので
  # デプロイのたびに消える = 304 が効かなくなる。fly.io では volume 上を
  # 指して永続させる。
  app.default_etags_dir: '%app.project_root%/var/cache/etags'
  app.etags_dir: '%env(default:app.default_etags_dir:ETAGS_DIR)%'

  app.site_url: '%env(default:app.default_site_url:SITE_URL)%'
  app.default_site_url: 'https://polidog.jp'

  app.disqus_shortname: '%env(default:app.empty:DISQUS_SHORTNAME)%'

  # `%env(default::VAR)%` は未設定時に **null** を返す。受け側は「空文字なら
  # 無効」で揃えてあるので、空文字を返すパラメータを既定値に指名する。
  app.empty: ''

  # 管理画面のログイン。入れるのはこの 1 組を知っている 1 人だけ。
  # ADMIN_PASSWORD_HASH に入れるのは平文ではなく password_hash() の出力
  # （`php bin/hash-password.php` で作る）。どちらかが空なら誰も入れない。
  app.admin.email: '%env(default:app.empty:ADMIN_EMAIL)%'
  app.admin.password_hash: '%env(default:app.empty:ADMIN_PASSWORD_HASH)%'

  # Cloudflare purge。未設定なら CachePurger は no-op になる。
  app.cloudflare.zone_id: '%env(default:app.empty:CLOUDFLARE_ZONE_ID)%'
  app.cloudflare.api_token: '%env(default:app.empty:CLOUDFLARE_API_TOKEN)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  App\Service\:
    resource: '../src/Service/'

  App\Auth\:
    resource: '../src/Auth/'
    # 値オブジェクトと例外はサービスではない。ディレクトリ丸ごとの登録に
    # 巻き込むと、コンテナのコンパイル時に「$clientId を解決できない」と
    # 言われてアプリごと起動しなくなる。
    exclude:
      - '../src/Auth/Oauth/AuthorizationRequest.php'
      - '../src/Auth/Oauth/OauthException.php'

  App\Http\:
    resource: '../src/Http/'

  App\Mcp\:
    resource: '../src/Mcp/'
    # 引数ラッパと例外はサービスではない（App\Auth\ の exclude と同じ理由）。
    exclude:
      - '../src/Mcp/Arguments.php'
      - '../src/Mcp/McpToolException.php'

  PDO:
    class: PDO
    factory: ['App\Infrastructure\PdoFactory', 'create']
    arguments: ['%app.database_path%']

  App\Tehilim\TehilimClient:
    factory: ['App\Tehilim\TehilimClient', 'fromPdo']
    arguments: ['@PDO']

  Polidog\Relayer\Http\FileEtagStore:
    arguments: ['%app.etags_dir%']

  # サイト全体の設定値。レイアウトとページから型で受け取れるようにする
  # （superglobals も getenv も触らせないため）。
  App\Support\SiteConfig:
    arguments:
      $siteUrl: '%app.site_url%'
      $disqusShortname: '%app.disqus_shortname%'

  # UserProvider をバインドすると Relayer が Authenticator を DI に登録し、
  # #[Auth] / requireAuth() / attempt() が動くようになる
  # （vendor/polidog/relayer/src/Di/ContainerFactory.php の遅延登録）。
  # 外すとログインだけでなく管理画面のガードごと死ぬ。
  Polidog\Relayer\Auth\UserProvider:
    alias: App\Auth\AdminUserProvider

  App\Service\CachePurger:
    arguments:
      $zoneId: '%app.cloudflare.zone_id%'
      $apiToken: '%app.cloudflare.api_token%'
      $siteUrl: '%app.site_url%'

  App\Service\MediaStorage:
    arguments:
      $uploadsDir: '%app.uploads_dir%'

  # 取り込んだ画像の一時ファイルを uploads と同じファイルシステムに置くため、
  # MediaStorage と同じディレクトリを渡す（rename がデバイスをまたげない）。
  App\Mcp\ImageFetcher:
    arguments:
      $uploadsDir: '%app.uploads_dir%'

  App\Auth\AdminUserProvider:
    arguments:
      $email: '%app.admin.email%'
      $passwordHash: '%app.admin.password_hash%'
