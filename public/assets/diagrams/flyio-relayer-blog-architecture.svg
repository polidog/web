<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Fly.io と Relayer で動く polidog.jp のブログ構成</title>
  <desc id="desc">Fly.io proxy から FrankenPHP/Caddy、Relayer、SQLite volume、管理画面の保存処理までの構成図。</desc>
  <defs>
    <style>
      .bg { fill: #fcfcfa; }
      .panel { fill: #f3f3ee; stroke: #d9d9d2; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #cfd4d8; stroke-width: 1.6; }
      .box-strong { fill: #eef7fb; stroke: #1b4965; stroke-width: 1.8; }
      .box-warm { fill: #fff7ed; stroke: #b45309; stroke-width: 1.8; }
      .box-green { fill: #f0fdf4; stroke: #166534; stroke-width: 1.8; }
      .box-muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .title { fill: #17171b; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 28px; font-weight: 700; }
      .subtitle { fill: #63636b; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 15px; }
      .label { fill: #17171b; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 17px; font-weight: 700; }
      .small { fill: #3f3f46; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 13px; }
      .tiny { fill: #63636b; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 12px; }
      .mono { fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .arrow { fill: none; stroke: #1b4965; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-muted { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow-muted); }
      .arrow-warm { fill: none; stroke: #b45309; stroke-width: 2.2; marker-end: url(#arrow-warm); }
      .dash { stroke-dasharray: 6 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b4965"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>

  <text class="title" x="54" y="58">Fly.io + FrankenPHP + Relayer で動くブログ</text>
  <text class="subtitle" x="54" y="86">公開ページ、管理画面、RSS/API を同じ Relayer ルーターに載せ、永続データだけ Fly Volume に逃がす構成。</text>

  <rect class="panel" x="42" y="118" width="1116" height="388" rx="14"/>
  <text class="label" x="66" y="151">リクエスト時の流れ</text>

  <rect class="box" x="66" y="188" width="156" height="86" rx="10"/>
  <text class="label" x="92" y="222">Browser</text>
  <text class="small" x="92" y="247">読者 / crawler</text>

  <rect class="box-strong" x="268" y="180" width="174" height="102" rx="10"/>
  <text class="label" x="306" y="215">Fly.io</text>
  <text class="small" x="300" y="240">HTTPS 終端</text>
  <text class="mono" x="300" y="262">web-fzmoua / nrt</text>

  <rect class="box-strong" x="488" y="180" width="194" height="102" rx="10"/>
  <text class="label" x="524" y="215">FrankenPHP</text>
  <text class="small" x="526" y="240">Caddy :8080</text>
  <text class="mono" x="526" y="262">Caddyfile</text>

  <rect class="box" x="736" y="150" width="178" height="78" rx="10"/>
  <text class="label" x="780" y="183">/assets</text>
  <text class="small" x="766" y="207">CSS / JS / favicon</text>

  <rect class="box-green" x="736" y="248" width="178" height="86" rx="10"/>
  <text class="label" x="786" y="282">/images</text>
  <text class="small" x="767" y="307">Volume から直接配信</text>

  <rect class="box-strong" x="736" y="370" width="178" height="86" rx="10"/>
  <text class="label" x="767" y="404">public/index.php</text>
  <text class="small" x="770" y="429">Relayer::boot()</text>

  <rect class="box-strong" x="958" y="370" width="156" height="86" rx="10"/>
  <text class="label" x="1000" y="403">Relayer</text>
  <text class="small" x="988" y="428">compiled routes</text>

  <rect class="box" x="958" y="150" width="156" height="78" rx="10"/>
  <text class="label" x="998" y="183">Pages</text>
  <text class="mono" x="988" y="207">src/Pages/**</text>

  <rect class="box-green" x="958" y="248" width="156" height="86" rx="10"/>
  <text class="label" x="998" y="281">SQLite</text>
  <text class="mono" x="986" y="306">/data/cms.db</text>

  <path class="arrow" d="M222 231 H268"/>
  <path class="arrow" d="M442 231 H488"/>
  <path class="arrow-muted" d="M682 216 C710 205, 710 189, 736 189"/>
  <path class="arrow-muted" d="M682 242 C710 256, 710 291, 736 291"/>
  <path class="arrow" d="M682 258 C710 305, 700 413, 736 413"/>
  <path class="arrow" d="M914 413 H958"/>
  <path class="arrow-muted" d="M1036 370 V334"/>
  <path class="arrow-muted" d="M1036 248 V228"/>
  <path class="arrow-muted dash" d="M958 413 C895 348, 903 263, 958 210"/>

  <text class="tiny" x="506" y="318">Caddy が静的ファイルと画像を先に分岐</text>
  <text class="tiny" x="777" y="486">その他の URL は PHP/Relayer へ</text>

  <rect class="panel" x="42" y="540" width="1116" height="158" rx="14"/>
  <text class="label" x="66" y="573">記事を書く / 保存する流れ</text>

  <rect class="box-warm" x="66" y="606" width="158" height="62" rx="10"/>
  <text class="label" x="104" y="633">Admin</text>
  <text class="mono" x="88" y="654">/admin/posts</text>

  <rect class="box-warm" x="276" y="606" width="170" height="62" rx="10"/>
  <text class="label" x="320" y="633">PostWriter</text>
  <text class="small" x="306" y="654">server action</text>

  <rect class="box" x="498" y="606" width="174" height="62" rx="10"/>
  <text class="label" x="526" y="633">Markdown</text>
  <text class="small" x="526" y="654">本文を HTML 化</text>

  <rect class="box-green" x="724" y="606" width="150" height="62" rx="10"/>
  <text class="label" x="758" y="633">DB 保存</text>
  <text class="mono" x="752" y="654">Post / Tag</text>

  <rect class="box-green" x="926" y="584" width="156" height="50" rx="10"/>
  <text class="label" x="969" y="615">ETag</text>

  <rect class="box-muted" x="926" y="648" width="156" height="50" rx="10"/>
  <text class="label" x="957" y="679">Cloudflare</text>

  <path class="arrow-warm" d="M224 637 H276"/>
  <path class="arrow-warm" d="M446 637 H498"/>
  <path class="arrow-warm" d="M672 637 H724"/>
  <path class="arrow-warm" d="M874 623 H926"/>
  <path class="arrow-muted" d="M874 652 H926"/>

  <rect class="box-muted" x="66" y="394" width="520" height="62" rx="10"/>
  <text class="small" x="92" y="418">Build: Tailwind / highlight.js / usephp compile</text>
  <text class="tiny" x="92" y="441">relayer routes:compile / container:compile。ランタイムに Node は入れない。</text>
</svg>
