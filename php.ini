; Relayer app — PHP overrides. The Dockerfile copies this into
; $PHP_INI_DIR/conf.d/ so it loads LAST and overrides the base
; image defaults: list only the directives you want to change,
; not a full php.ini. APP_ENV (in .env), not this file, drives
; the framework's dev/prod behaviour.

expose_php = Off
memory_limit = 256M

; エラーの扱い。ベースイメージは php.ini を 1 つも読まないので、素のままだと
; display_errors=STDOUT / log_errors=Off —— つまり Deprecated を含む全エラーが
; レスポンス本文に混ざり、ログには残らない（curl_close() の deprecated 警告で
; JSON が壊れたのがこれ）。本文には出さず、stderr（= docker / fly のログ）に
; だけ流す。Deprecated は vendor からも大量に出るので報告自体を止める。
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On

; 警告・Deprecated をレスポンス本文に出さない。出ると本文の先頭に混ざり、
; JSON 応答が壊れたり headers already sent になる（vendor の curl_close()
; が PHP 8.5 で deprecated になった際に実際に起きた）。ログには出続ける
; （log_errors は既定で On、FrankenPHP は stderr → fly logs に流す）。
display_errors = Off

; 記事の URL が日付から作られる（/2024/12/28/slug/）ので、タイムゾーンが
; ずれると URL そのものが変わってしまう。JST で固定する。
; エントリポイント側でも date_default_timezone_set() しているので、
; この ini を読まない環境（php -S での開発）でも同じ結果になる。
date.timezone = Asia/Tokyo

; File uploads (keep the two in sync; post_max_size >= upload):
upload_max_filesize = 16M
post_max_size = 16M

; OPcache. The defaults below are dev-safe (timestamps are
; validated, so edited files reload). For production, run the
; three precompile steps so there is nothing to compile per
; request:
;   vendor/bin/usephp compile src/Pages    ; .psx  -> PHP cache
;   vendor/bin/relayer routes:compile       ; route map -> PHP
;   vendor/bin/relayer container:compile     ; DI container -> PHP
; then uncomment the production block.
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
; Must exceed the app's total PHP file count (vendor tree +
; one compiled file per .psx page). PHP rounds up to a prime.
opcache.max_accelerated_files = 16000

; --- Production ---
; Dockerfile が上の 3 つの事前コンパイルを済ませてからこの ini を置く。
; すべて PHP に落ちているので stat() を止め、キャッシュを失効させない
; （更新 = 再デプロイ）。ローカルで `php -S` を使うときはコンテナを
; 通らないので、この設定は効かない（= 編集がそのまま反映される）。
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
