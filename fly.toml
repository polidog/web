# fly.toml app configuration file generated for web-fzmoua on 2026-08-16T05:21:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'web-fzmoua'
primary_region = 'nrt'

[build]

[deploy]
  strategy = 'immediate'

[env]
  APP_ENV = 'production'
  DATABASE_PATH = '/data/cms.db'
  DISQUS_SHORTNAME = 'polidoglab'
  ETAGS_DIR = '/data/etags'
  SERVER_NAME = ':8080'
  SITE_URL = 'https://polidog.jp'
  UPLOADS_DIR = '/data/uploads'

[[mounts]]
  source = 'polidog_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
