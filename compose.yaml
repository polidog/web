# ローカルで本番と同じ形（FrankenPHP + Caddy + volume）を動かすための
# 構成。`docker compose up --build` して http://localhost:8080 を開く。
#
# 普段の開発は `php -S 127.0.0.1:8000 -t public` のほうが速い（.psx が
# リクエストごとに再コンパイルされる）。こちらは「デプロイと同じ経路で
# 動くか」を確かめたいときに使う。
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # イメージは本番設定でビルドされている（.psx は事前コンパイル済み）。
      APP_ENV: production
      SERVER_NAME: ":8080"
      DATABASE_PATH: /data/cms.db
      UPLOADS_DIR: /data/uploads
      ETAGS_DIR: /data/etags
      SITE_URL: http://localhost:8080
      DISQUS_SHORTNAME: polidoglab
      # 管理画面に入りたいときは、この 2 つを渡して起動する
      # （ハッシュは php bin/hash-password.php の出力）。compose はこの
      # ファイル内の `$` を変数展開するので、ここに直接書くなら `$` を
      # `$$` に置き換えること。素の値のまま渡すなら `--env-file` を使う。
      # ADMIN_EMAIL: you@example.com
      # ADMIN_PASSWORD_HASH: $$2y$$12$$...
    volumes:
      # fly の volume に対応するもの。DB・画像・ETag はここに残る。
      - app-data:/data

volumes:
  app-data:
